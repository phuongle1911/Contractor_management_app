services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contractor_management
      POSTGRES_USER: contractor_app
      POSTGRES_PASSWORD: contractor_dev_password
    ports:
      - "5433:5432"
    volumes:
      - contractor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractor_app -d contractor_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contractor_postgres_data: