services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contractor_management
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - contractor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d contractor_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: DOCKERFILE
    container_name: contractor_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    # environment:
    #   POSTGRES_URL: ${DB_URL}
    #   POSTGRES_USER: ${DB_USERNAME}
    #   POSTGRES_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  contractor_postgres_data:
