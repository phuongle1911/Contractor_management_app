spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/contractor_management}
spring.datasource.username=${DB_USERNAME:contractor_app}
spring.datasource.password=${DB_PASSWORD:contractor_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}