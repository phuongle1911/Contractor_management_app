spring.application.name=backend

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://postgres:5432/contractor_management}
spring.datasource.username=${POSTGRES_USER:contractor_app}
spring.datasource.password=${POSTGRES_PASSWORD:contractor_dev_password}
spring.jpa.database=POSTGRESQL
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL94Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server.port=8080